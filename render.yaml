services:
  - type: web
    name: wanderlust
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && node -e "const mongoose = require('mongoose'); console.log('Mongoose dependency OK:', mongoose.version)"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ATLASDB_URL
        sync: false
      - key: SECRET
        sync: false
